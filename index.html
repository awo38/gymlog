<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GymLog</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="theme-color" content="#08080a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: eine Spalte weicher Kacheln, runde Icon-Knöpfe, Punktmatrix-Ziffern; schwebende Pillen-Navigation unten. */
:root{
  --bg:#eceef1; --card:#f8f8f9; --card-2:#e4e6ea; --disc:#e6e8eb;
  --ink:#0c0c0d; --ink-2:#74767d; --ink-3:#b6b8bd; --line:rgb(0 0 0 / .07);
  --accent:#ece04a; --on-accent:#131200; --prop:#7d3a9a; --chart:#0c0c0d; --red:#d93d42; --good:#178a4e;
  --nav:#0e0e10; --nav-2:#1f1f22; --nav-ink:#f3f3f4; --scrim:rgb(10 10 12 / .38);
  --plum:linear-gradient(155deg,#e6b2ee 0%,#9c48b8 40%,#3a1250 100%);
  --indigo:linear-gradient(160deg,#9890f2 0%,#4038ad 45%,#13103f 100%);
  --shadow:0 1px 0 rgb(255 255 255 / .8) inset,0 14px 30px -20px rgb(0 0 0 / .35);
  --ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dot:"Doto","Outfit",ui-monospace,monospace;
  --r:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08080a; --card:#141416; --card-2:#202024; --disc:transparent;
  --ink:#f3f3f4; --ink-2:#8c8c93; --ink-3:#3c3c42; --line:rgb(255 255 255 / .08);
  --accent:#f2e23a; --on-accent:#131200; --prop:#f2e23a; --chart:#f2e23a; --red:#ff6b6b; --good:#4ade80;
  --nav:#000000; --nav-2:#1a1a1d; --nav-ink:#f3f3f4; --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 0 rgb(255 255 255 / .05) inset,0 20px 40px -26px rgb(0 0 0 / .95); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08080a; --card:#141416; --card-2:#202024; --disc:transparent;
  --ink:#f3f3f4; --ink-2:#8c8c93; --ink-3:#3c3c42; --line:rgb(255 255 255 / .08);
  --accent:#f2e23a; --on-accent:#131200; --prop:#f2e23a; --chart:#f2e23a; --red:#ff6b6b; --good:#4ade80;
  --nav:#000000; --nav-2:#1a1a1d; --nav-ink:#f3f3f4; --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 0 rgb(255 255 255 / .05) inset,0 20px 40px -26px rgb(0 0 0 / .95); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{border:0;outline:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:600px;margin:0 auto;padding-block:6px 150px;display:flex;flex-direction:column;gap:14px}
.dots{font-family:var(--dot);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--ink-2)}

/* Kopfzeile */
.top{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;min-height:64px}
.top h1{margin:0;text-align:center;font-size:22px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top > :last-child{justify-self:end;min-width:48px;display:flex;justify-content:flex-end}
.rbtn{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.rbtn svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;gap:2px;padding:4px 4px 0}
.hello{font-size:15px;color:var(--ink-2)}
.title{margin:0;font-size:34px;font-weight:500;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
.title span{display:block;color:var(--ink-2);font-weight:400}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.sync[data-s="saving"]::before{background:var(--accent)}
.sync[data-s="offline"]::before,.sync[data-s="error"]::before{background:#e8962a}

/* Bausteine */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.k{font-size:15px;font-weight:500}
.k small,.cap-s{display:block;font-size:13px;font-weight:400;color:var(--ink-2)}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.pill.full{width:100%}
.pill.sm{min-height:40px;padding:0 16px;font-size:15px}
.pill.dark{background:var(--nav);color:var(--nav-ink)}
.pill.soft{background:var(--card-2);color:var(--ink)}
.pill:disabled{opacity:.4}
.pill svg{width:18px;height:18px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--card-2);font-size:13px;font-weight:500}
.tag svg{width:14px;height:14px}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:999px;background:var(--card-2);font-size:14px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;text-align:left;width:100%}
.li + .li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li .t1{font-size:16px;overflow-wrap:anywhere}
.li .t2{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.li .val{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;text-align:right}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--card-2);flex:none}
.mini svg{width:16px;height:16px}
.mini.del{color:var(--red)}
.mini:disabled{opacity:.3}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-left:6px;vertical-align:2px}
.empty-note{font-size:14px;color:var(--ink-2);padding:6px 0}

/* Wochenziel-Ring */
.gauge-card{background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:13px 13px;background-color:var(--card)}
.gauge{position:relative;width:100%;max-width:min(330px,38vh);aspect-ratio:1;margin:0 auto}
.gauge::before{content:"";position:absolute;inset:4%;border-radius:50%;background:var(--disc)}
.gauge svg{position:absolute;inset:0;width:100%;height:100%}
.gauge line{stroke:var(--ink-3);stroke-width:.5;stroke-linecap:round}
.gauge line.on{stroke:var(--ink)}
.gauge line.mk{stroke:var(--accent);stroke-width:1.1}
.g-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,22px)}
.g-c{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.huge{font-size:clamp(52px,min(22vw,11vh),96px);line-height:.9}
.huge span{font-size:.45em;color:var(--ink-2)}
.g-c small,.side small{font-size:13px;color:var(--ink-2);line-height:1.2}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;opacity:.9}
.side b{font-size:22px;color:var(--ink-2)}
.gc-foot{font-size:14px;color:var(--ink-2)}

/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:26px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;box-shadow:var(--shadow);background:var(--card);min-width:0;position:relative;overflow:hidden}
.tile.tall{grid-row:span 2}
.tile.plum{background:var(--plum);color:#fff}
.tile.indigo{background:var(--indigo);color:#fff}
.tile.plum small,.tile.indigo small{color:rgb(255 255 255 / .72)}
.tile .big{font-size:clamp(34px,11vw,46px);line-height:.95}
.tile .unit{font-family:var(--ui);font-weight:400;font-size:15px;margin-left:4px;color:inherit;opacity:.7}
.ring{position:absolute;right:12px;top:12px;width:58px;height:58px}
.ring circle{fill:none;stroke-width:3.4}
.ring .tr{stroke:rgb(255 255 255 / .22)}
.ring .pg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.delta{font-size:13px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ink)}.delta.down{color:var(--ink)}
.spark{width:100%;height:46px;display:block}
.spark path{fill:none;stroke:var(--chart);stroke-width:2;vector-effect:non-scaling-stroke}

/* Diagramme */
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:130px}
.bar-c{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar-c i{display:block;width:100%;max-width:26px;border-radius:9px;background:var(--card-2);min-height:4px}
.bar-c.cur i{background:var(--accent)}
.bar-c small{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.hbar .tr{height:10px;border-radius:999px;background:var(--card-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.hbar b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.chart{position:relative;height:170px;margin-right:42px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .ln{fill:none;stroke:var(--chart);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.chart .gl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 4}
.chart .yl{position:absolute;right:-42px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.chart .pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--card);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--chart)}
.xl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-right:42px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{font-size:12px;color:var(--ink-2)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums;font-size:16px}

/* Gewicht eintragen */
.w-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;height:56px;padding:0 16px;border-radius:999px;background:var(--card-2);min-width:0}
.field.num{flex:1 1 130px}
.field.num input{flex:1;min-width:0;font-family:var(--dot);font-weight:900;font-size:26px}
.field.num span{color:var(--ink-2)}
.field.date{flex:1 1 140px}
.field.date input{flex:1;min-width:0;font-size:15px}
.field.err{box-shadow:0 0 0 2px var(--red)}

/* Pläne + Editor */
.plan-name{font-size:24px;font-weight:500;letter-spacing:-.015em;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.name-in{width:100%;font-size:26px;font-weight:500;letter-spacing:-.015em;padding:4px 2px}
.name-in::placeholder,.inline::placeholder,textarea::placeholder,input::placeholder{color:var(--ink-3)}
.ex-row{display:flex;align-items:center;gap:10px}
.ex-row .inline{flex:1;min-width:0;font-size:17px;padding:6px 0}
.ex-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ex-nums label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.ex-nums input{background:var(--card-2);border-radius:14px;height:44px;text-align:center;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;width:100%;min-width:0;color:var(--ink)}
.ex-card{gap:10px}

/* Training */
.wo-sum{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:4px}
.clockbig{font-size:56px;line-height:1}
.wo-sum small{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.entry{scroll-margin-top:calc(16px + env(safe-area-inset-top,0px));gap:10px}
.e-head{display:flex;align-items:center;gap:12px}
.e-head .grow{flex:1;min-width:0}
.e-head h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.e-sub{font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.e-sub b{font-weight:500;color:var(--ink)}
.swapped{color:var(--prop)}
.count{font-size:20px;color:var(--ink-2)}
.grid-h,.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.grid-h{font-size:12px;color:var(--ink-2);text-align:center}
.set{border-radius:18px;padding:3px;transition:background .15s}
.set .n{text-align:center;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.set input{width:100%;min-width:0;height:48px;border-radius:15px;background:var(--card-2);text-align:center;font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;justify-self:center;transition:background .15s,border-color .15s}
.chk svg{width:18px;height:18px;stroke-width:3}
.set.done{background:var(--card-2)}
.set.done input{background:transparent;color:var(--ink-2)}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.e-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.e-actions .sp{flex:1}
textarea.note{display:block;width:100%;resize:none;min-height:44px;padding:12px 16px;font-size:15px;border-radius:18px;background:var(--card-2);color:var(--ink)}

/* Verlauf */
.h-group{display:flex;flex-direction:column;gap:10px}
.h-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:8px 6px 0}
.h-top{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.h-top .grow{flex:1;min-width:0}
.h-top .t1{font-size:18px;font-weight:500}
.h-top .t2{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.h-top .chev{transition:transform .2s;color:var(--ink-2)}
.h-top[aria-expanded="true"] .chev{transform:rotate(90deg)}
.h-ex .nt{font-size:13px;color:var(--ink-2);font-style:italic}

/* Navigation unten */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--nav);box-shadow:0 18px 40px -14px rgb(0 0 0 / .6);max-width:calc(100% - 32px)}
nav.tabs button{height:52px;min-width:52px;border-radius:999px;background:var(--nav-2);color:var(--nav-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 15px;font-size:15px;font-weight:500;transition:background .2s}
nav.tabs button span{display:none}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent);padding:0 20px}
nav.tabs button[aria-current="page"] span{display:inline}
nav.tabs button.live{color:var(--accent)}

#timer{position:fixed;z-index:25;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  background:var(--nav);color:var(--nav-ink);border-radius:30px;padding:14px 14px 14px 20px;box-shadow:0 18px 40px -14px rgb(0 0 0 / .6);max-width:568px;margin:0 auto}
#timer .in{display:flex;flex-direction:column;gap:10px}
#timer .row{display:flex;align-items:center;gap:8px}
#timer .time{flex:1;display:flex;flex-direction:column}
#timer .time small{font-size:13px;color:rgb(255 255 255 / .55)}
#timer .time span{font-family:var(--dot);font-weight:900;font-size:40px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cap{height:44px;min-width:52px;padding:0 12px;border-radius:999px;background:var(--nav-2);color:var(--nav-ink);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.cap.tint{background:var(--accent);color:var(--on-accent);font-weight:600}
.bar{height:3px;border-radius:2px;background:rgb(255 255 255 / .14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left;transition:transform .25s linear}
#timer.over .time span{color:#4ade80}

/* Piktogramme */
.picto{flex:none;width:46px;height:46px;border-radius:15px;background:var(--card-2);display:grid;place-items:center}
.picto.sm{width:34px;height:34px;border-radius:11px}
.picto.lg{width:52px;height:52px;border-radius:17px}
.picto-svg{width:86%;height:86%;fill:none;stroke:none}
.picto-svg .pb{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.picto-svg .pb.back{opacity:.3}
.picto-svg .ph{fill:var(--ink)}
.picto-svg .px{stroke:var(--prop);stroke-width:2.4;stroke-linecap:round;fill:none}
.picto-svg .px.thin{stroke-width:1.3;stroke-dasharray:2 2}
.picto-svg .px-f{fill:var(--prop);stroke:none}

/* Übungsauswahl */
#picker{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.pk-top{max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.pk-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:64px}
.pk-head h3{font-size:20px;font-weight:500;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;height:52px;padding:0 18px;color:var(--ink-2)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;font-size:17px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.pk-plan{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;background:var(--card);border-radius:999px;padding:8px 8px 8px 20px;box-shadow:var(--shadow)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--card-2);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .25);transition:transform .2s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(20px)}
#pk-list{flex:1;overflow-y:auto;max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.pk-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:4px 6px 0}
.pk-card{background:var(--card);border-radius:24px;padding:4px 14px;box-shadow:var(--shadow)}
.pk-card.sug{background:var(--indigo);color:#fff}
.pk-card.sug .li + .li{border-top-color:rgb(255 255 255 / .14)}
.pk-card.sug .t2{color:rgb(255 255 255 / .7)}
.pk-card.sug .picto{background:rgb(255 255 255 / .9)}
.pk-card.sug .picto-svg .pb,.pk-card.sug .picto-svg .ph{stroke:#111;}
.pk-card.sug .picto-svg .ph{fill:#111}
.pk-card.sug .picto-svg .px{stroke:#5a2a8a}.pk-card.sug .picto-svg .px-f{fill:#5a2a8a}

/* Dialog */
#modal{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .sheet{background:var(--card);border-radius:32px;width:100%;max-width:440px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
#modal .body{display:flex;flex-direction:column;gap:6px}
#modal h3{font-size:22px;font-weight:500;margin:0;letter-spacing:-.01em}
#modal p{margin:0;font-size:15px;color:var(--ink-2)}
#modal input{margin-top:10px;background:var(--card-2);border-radius:999px;height:52px;padding:0 18px;font-size:17px}
#modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#modal .row button{min-height:52px;border-radius:999px;font-size:16px;font-weight:600;background:var(--card-2)}
#modal #m-ok{background:var(--accent);color:var(--on-accent)}
#modal #m-ok.danger{background:var(--red);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  <div id="pk-list"></div>
</div>

<div id="modal" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="m-title">
    <div class="body">
      <h3 id="m-title"></h3>
      <p id="m-text"></p>

    <div class="row">

  const remoteIds = new Set(remote.map(h => h.id));

/* ---------- Verlauf-Helfer ---------- */
function lastFor(name) {
  const key = norm(name);
  for (const w of S.history) {
    const e = (w.entries || []).find(x => norm(x.name) === key && x.sets.some(s => s.done));
    if (e) return { date: w.start, sets: e.sets.filter(s => s.done) };
  }
  return null;
}
function lastNote(name) {
  const key = norm(name);
  for (const w of S.history) {
    const e = (w.entries || []).find(x => norm(x.name) === key && (x.note || "").trim());
    if (e) return e.note;
  }
  return "";
}
function makeEntry(name, sets, reps, rest, tpl) {
  const last = lastFor(name);
  if (!last && tpl && tpl.length) return { id: uid(), name, rest, note: lastNote(name),
    sets: Array.from({ length: Math.max(1, sets) }, (_, i) => { const t = tpl[i] || tpl[tpl.length - 1]; return { w: t.w, r: t.r ?? reps, done: false }; }) };
  return {
    id: uid(), name, rest, note: lastNote(name),
    sets: Array.from({ length: Math.max(1, sets) }, (_, i) => {
      const ref = last ? (last.sets[i] || last.sets[last.sets.length - 1]) : null;
      return { w: ref ? ref.w : null, r: reps, done: false };
    })
  };
}
// Körpergewichtsübungen: Last = Körpergewicht am Trainingstag + Zusatzgewicht
const BW_MOVES = ["pull-v", "dip", "press-h"];
const isBW = name => { const x = findEx(name); return !!x && x.q === "bw" && BW_MOVES.includes(x.m); };
function bwAt(t) {
  const W = S.body.weights; if (!W.length) return 0;
  let r = W[0].kg;
  for (const w of W) { if (w.t <= t + 864e5) r = w.kg; else break; }
  return r;
}
const load = (name, w, t) => isBW(name) ? bwAt(t) + (w || 0) : (w || 0);
const volume = w => (w.entries || []).reduce((a, e) => a + e.sets.reduce((b, s) => b + (s.done ? load(e.name, s.w, w.start) * (s.r || 0) : 0), 0), 0);
const setsSummary = (sets, name) => { const bw = name && isBW(name); return sets.map(s => (bw ? "+" : "") + kg(s.w || (bw ? 0 : s.w)) + " × " + (s.r ?? "–")).join("  ·  "); };

/* ---------- Statistik ---------- */
const DAY = 864e5;
const weekStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const prevWeek = s => weekStart(s - DAY);
const isoWeek = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / DAY - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const tons = v => v >= 1000 ? kg(Math.round(v / 100) / 10) + " t" : kg(Math.round(v)) + " kg";
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const signed = (v, unit = "") => (v > 0 ? "+" : v < 0 ? "−" : "±") + kg(Math.abs(v)) + unit;
const e1rm = s => (s.w || 0) * (s.r > 1 ? 1 + s.r / 30 : 1);

function stats() {
  const ws = weekStart(Date.now()), H = S.history;
  const perWeek = new Map(), volWeek = new Map();
  for (const w of H) {
    const k = weekStart(w.start);
    perWeek.set(k, (perWeek.get(k) || 0) + 1);
    volWeek.set(k, (volWeek.get(k) || 0) + volume(w));
  }
  const lw = prevWeek(ws);
  let streak = 0, s = perWeek.get(ws) ? ws : lw;
  while (perWeek.get(s)) { streak++; s = prevWeek(s); }
  const weeks = []; s = ws;
  for (let i = 0; i < 8; i++) { weeks.unshift({ s, vol: volWeek.get(s) || 0, n: perWeek.get(s) || 0 }); s = prevWeek(s); }

  const since30 = Date.now() - 30 * DAY, groups = new Map();
  for (const w of H) if (w.start >= since30) for (const e of w.entries) {
    const g = (findEx(e.name) || {}).g || "Andere";
    groups.set(g, (groups.get(g) || 0) + e.sets.length);
  }

  const best = new Map();
  for (const w of [...H].reverse()) for (const e of w.entries) {
    const key = norm(e.name);
    for (const st of e.sets) {
      const v = e1rm({ w: load(e.name, st.w, w.start), r: st.r }); if (!v) continue;
      const b = best.get(key);
      if (!b) best.set(key, { name: e.name, set: st, v, t: w.start, improved: false });
      else if (v > b.v + 1e-9) best.set(key, { name: e.name, set: st, v, t: w.start, improved: true });
    }
  }
  const prs = [...best.values()].sort((a, b) => b.t - a.t).slice(0, 5);
  const totalVol = H.reduce((a, w) => a + volume(w), 0);
  const totalMs = H.reduce((a, w) => a + (w.end ? w.end - w.start : 0), 0);
  return { thisN: perWeek.get(ws) || 0, lastN: perWeek.get(lw) || 0, thisVol: volWeek.get(ws) || 0, lastVol: volWeek.get(lw) || 0,
    streak, weeks, groups: [...groups.entries()].sort((a, b) => b[1] - a[1]), prs, total: H.length, totalVol, totalMs };
}
function weightInfo() {
  const W = S.body.weights;
  if (!W.length) return null;
  const cur = W[W.length - 1], cut = Date.now() - 30 * DAY;
  const ref = [...W].reverse().find(w => w.t <= cut) || W[0];
  return { cur, d30: cur.kg - ref.kg, refT: ref.t, first: W[0] };
}

/* ---------- Grafik-Helfer ---------- */
function gauge(frac, n = 72) {
  const on = Math.round(Math.max(0, Math.min(1, frac)) * n);
  let s = "";
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, long = i % 6 === 0;
    const r1 = long ? 40.5 : 43, r2 = 46.5;
    const c = i === on - 1 ? "mk" : i < on ? "on" : "";
    s += `<line x1="${(50 + r1 * Math.cos(a)).toFixed(2)}" y1="${(50 + r1 * Math.sin(a)).toFixed(2)}" x2="${(50 + r2 * Math.cos(a)).toFixed(2)}" y2="${(50 + r2 * Math.sin(a)).toFixed(2)}"${c ? ` class="${c}"` : ""}/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
}
function ring(frac) {
  const C = 2 * Math.PI * 24, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 58 58" aria-hidden="true"><circle class="tr" cx="29" cy="29" r="24"/><circle class="pg" cx="29" cy="29" r="24" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}"/></svg>`;
}
function scale(pts, W, Hh, pad = 0.12) {
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
  const span = hi - lo; lo -= span * pad; hi += span * pad;
  const x = t => t1 === t0 ? W / 2 : ((t - t0) / (t1 - t0)) * W;
  const y = v => Hh - ((v - lo) / (hi - lo)) * Hh;
  return { x, y, lo, hi };
}
function spark(pts) {
  if (pts.length < 2) return "";
  const { x, y } = scale(pts, 100, 40, 0.15);
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="${pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(2) + " " + y(p.v).toFixed(2)).join("")}"/></svg>`;
}
function lineChart(pts) {
  if (pts.length < 2) return `<p class="empty-note">Trag mindestens zwei Werte ein, dann erscheint hier dein Verlauf.</p>`;
  const W = 300, Hh = 140, { x, y, lo, hi } = scale(pts, W, Hh);
  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(2) + " " + y(p.v).toFixed(2)).join("");
  const area = line + `L${x(pts[pts.length - 1].t).toFixed(2)} ${Hh}L${x(pts[0].t).toFixed(2)} ${Hh}Z`;
  const last = pts[pts.length - 1];
  const yl = v => `<span class="yl" style="top:${(y(v) / Hh * 100).toFixed(1)}%">${kg(Math.round(v * 10) / 10)}</span>`;
  const vmax = Math.max(...pts.map(p => p.v)), vmin = Math.min(...pts.map(p => p.v));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-label="Gewichtsverlauf">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      <line class="gl" x1="0" x2="${W}" y1="${y(vmax)}" y2="${y(vmax)}"/><line class="gl" x1="0" x2="${W}" y1="${y(vmin)}" y2="${y(vmin)}"/>
      <path d="${area}" fill="url(#wg)"/><path class="ln" d="${line}"/></svg>
      ${yl(vmax)}${vmin !== vmax ? yl(vmin) : ""}
      <i class="pt" style="left:${(x(last.t) / W * 100).toFixed(1)}%;top:${(y(last.v) / Hh * 100).toFixed(1)}%"></i></div>
    <div class="xl"><span>${fmtDate(pts[0].t)}</span><span>${fmtDate(last.t)}</span></div>`;
}

/* ---------- Dialog (statt confirm/prompt) ---------- */
function ask({ title, text = "", ok = "OK", danger = false, input = null }) {
  return new Promise(res => {
    const m = document.getElementById("modal"), inp = document.getElementById("m-input");
    document.getElementById("m-title").textContent = title;
    const pt = document.getElementById("m-text"); pt.textContent = text; pt.hidden = !text;
    const okB = document.getElementById("m-ok"), cB = document.getElementById("m-cancel");
    okB.textContent = ok; okB.className = danger ? "danger" : "";
    inp.hidden = input == null; inp.value = ""; inp.placeholder = input || "";
    m.hidden = false;
    if (input != null) setTimeout(() => inp.focus(), 50); else okB.focus();
    const done = v => { m.hidden = true; okB.onclick = cB.onclick = m.onclick = inp.onkeydown = null; res(v); };
    okB.onclick = () => done(input != null ? inp.value.trim() : true);
    cB.onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    inp.onkeydown = e => { if (e.key === "Enter") okB.onclick(); };
  });
}

/* ---------- Pausen-Timer ---------- */
let actx = null;
function primeAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
function beep() {
  if (!actx) return;
  try {
    const t = actx.currentTime;
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
      o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + 0.2);
    });
  } catch (e) {}
}
function startTimer(sec) {
  if (!sec || sec <= 0) return;
  S.timer = { end: Date.now() + sec * 1000, total: sec * 1000, rang: false };
  saveLocal(); tick();
}
let overHide = null;
function tick() {
  const el = document.getElementById("timer");
  const clock = document.getElementById("clock");
  if (clock && S.active) clock.textContent = elapsed(Date.now() - S.active.start);
  const show = !!S.timer && S.view === "workout";
  if (!S.timer) { if (!el.hidden) { el.hidden = true; renderTabs(); } return; }
  const left = (S.timer.end - Date.now()) / 1000;
  if (left <= 0) {
    if (!S.timer.rang) {
      S.timer.rang = true;
      if (left > -5) { beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
      clearTimeout(overHide);
      overHide = setTimeout(() => { S.timer = null; saveLocal(); tick(); }, left > -5 ? 4000 : 1500);
    }
    el.classList.add("over");
    document.getElementById("t-label").textContent = "Pause vorbei";
    document.getElementById("t-val").textContent = "Los geht's";
    document.getElementById("t-bar").style.transform = "scaleX(1)";
  } else {
    el.classList.remove("over");
    document.getElementById("t-label").textContent = "Pause";
    document.getElementById("t-val").textContent = mmss(Math.ceil(left));
    document.getElementById("t-bar").style.transform = `scaleX(${Math.max(0, Math.min(1, left * 1000 / S.timer.total))})`;
  }
  if (el.hidden === show) { el.hidden = !show; renderTabs(); }
}
setInterval(tick, 250);

let wakeLock = null;
async function keepAwake() {
  try {
    if (S.view === "workout" && S.active && "wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if ((S.view !== "workout" || !S.active) && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* ---------- Aktionen ---------- */
const plan = id => S.plans.find(p => p.id === id);
const editing = () => plan(S.editId);

const A = {
  tab(el) { S.view = el.dataset.view; render(); window.scrollTo(0, 0); },
  "new-plan"() {
    const p = { id: uid(), name: "", exercises: [] };
    S.plans.push(p); persist("plans");
    S.editId = p.id; S.view = "edit"; render(); window.scrollTo(0, 0);
    setTimeout(() => document.getElementById("plan-name")?.focus(), 50);
  },
  "sample-plan"() {
    const ex = (name, sets, reps, rest) => ({ id: uid(), name, sets, reps, rest });
    S.plans.push({ id: uid(), name: "Ganzkörper (Beispiel)", exercises: [
      ex("Kniebeugen", 3, 8, 150), ex("Bankdrücken", 3, 8, 120), ex("Rudern am Kabel", 3, 10, 90),
      ex("Schulterdrücken KH", 3, 10, 90), ex("Beinbeuger", 3, 12, 60) ] });
    persist("plans"); render();
  },
  "edit-plan"(el) { S.editId = el.dataset.plan; S.view = "edit"; render(); window.scrollTo(0, 0); },
  async "del-plan"() {
    const p = editing(); if (!p) return;
    if (!(await ask({ title: "Plan löschen?", text: `„${p.name || "Ohne Namen"}“ wird entfernt. Dein Verlauf bleibt erhalten.`, ok: "Löschen", danger: true }))) return;
    S.plans = S.plans.filter(x => x !== p); persist("plans"); S.view = "plans"; render();
  },
  async "add-ex"() {
    const name = await pickExercise("Übung hinzufügen");
    const p = editing(); if (!name || !p) return;
    const ex = findEx(name), d = defaultsFor(ex);
    const e = { id: uid(), name: ex ? ex.n : name, sets: d.sets, reps: d.reps, rest: d.rest };
    p.exercises.push(e); persist("plans"); render();
    setTimeout(() => document.getElementById(`ex-${e.id}-name`)?.closest(".card")?.scrollIntoView({ block: "center" }), 50);
  },
  "del-ex"(el) { const p = editing(); p.exercises = p.exercises.filter(e => e.id !== el.dataset.ex); persist("plans"); render(); },
  "move-ex"(el) {
    const p = editing(); const i = p.exercises.findIndex(e => e.id === el.dataset.ex), j = i + Number(el.dataset.d);
    if (j < 0 || j >= p.exercises.length) return;
    [p.exercises[i], p.exercises[j]] = [p.exercises[j], p.exercises[i]]; persist("plans"); render();
  },
  async start(el) {
    const p = plan(el.dataset.plan); if (!p) return;
    if (S.active && !(await ask({ title: "Laufendes Training ersetzen?", text: `„${S.active.planName}“ ist noch nicht beendet und wird verworfen.`, ok: "Neu starten", danger: true }))) return;
    S.active = { id: uid(), planId: p.id, planName: p.name || "Training", start: Date.now(),
      entries: p.exercises.filter(e => e.name.trim()).map(e => makeEntry(e.name.trim(), e.sets, e.reps, e.rest, e.tpl)) };
    S.timer = null; persist("active"); S.view = "workout"; render(); window.scrollTo(0, 0);
  },
  check(el) {
    primeAudio();
    const e = S.active.entries[+el.dataset.e], s = e.sets[+el.dataset.s];
    // Offenes Eingabefeld übernehmen, bevor abgehakt wird
    if (document.activeElement && document.activeElement.dataset.bind) document.activeElement.blur();
    s.done = !s.done;
    const row = el.closest(".set"); row.classList.toggle("done", s.done); el.setAttribute("aria-pressed", s.done);
    document.getElementById("cnt-" + e.id).textContent = e.sets.filter(x => x.done).length + "/" + e.sets.length;
    if (s.done) { startTimer(e.rest); try { navigator.vibrate && navigator.vibrate(30); } catch (x) {} }
    persist("active");
  },
  "add-set"(el) {
    const e = S.active.entries[+el.dataset.e]; const l = e.sets[e.sets.length - 1];
    e.sets.push({ w: l ? l.w : null, r: l ? l.r : 10, done: false }); persist("active"); render();
  },
  "rm-set"(el) { const e = S.active.entries[+el.dataset.e]; if (e.sets.length > 1) { e.sets.pop(); persist("active"); render(); } },
  async "swap-entry"(el) {
    const i = +el.dataset.e, e = S.active.entries[i];
    const name = await pickExercise("Übung tauschen", { name: e.name, planId: S.active.planId });
    if (!name || !S.active || norm(name) === norm(e.name)) return;
    const alsoPlan = document.getElementById("pk-plan-cb").checked;
    const doneSets = e.sets.filter(s => s.done).length;
    if (doneSets && !(await ask({ title: "Übung tauschen?", text: `${doneSets} erledigte ${doneSets === 1 ? "Satz wird" : "Sätze werden"} von ${e.name} verworfen.`, ok: "Tauschen", danger: true }))) return;
    const ex = findEx(name), newName = ex ? ex.n : name, d = defaultsFor(ex);
    const reps = e.sets[0] && e.sets[0].r != null ? e.sets[0].r : d.reps;
    const n = makeEntry(newName, e.sets.length, reps, e.rest);
    n.id = e.id; n.from = e.from || e.name;
    if (norm(n.from) === norm(newName)) delete n.from;
    S.active.entries[i] = n; persist("active");
    if (alsoPlan) {
      const p = plan(S.active.planId);
      const pe = p && p.exercises.find(x => norm(x.name) === norm(n.from || e.name));
      if (pe) { pe.name = newName; delete n.from; persist("plans"); }
    }
    render();
    setTimeout(() => document.querySelector(`[data-entry="${n.id}"]`)?.scrollIntoView({ block: "start", behavior: "smooth" }), 50);
  },
  async "rm-entry"(el) {
    const e = S.active.entries[+el.dataset.e];
    if (!(await ask({ title: `${e.name} entfernen?`, text: "Die Übung wird aus diesem Training gelöscht.", ok: "Entfernen", danger: true }))) return;
    S.active.entries.splice(+el.dataset.e, 1); persist("active"); render();
  },
  async "add-entry"() {
    const name = await pickExercise("Übung hinzufügen");
    if (!name || !S.active) return;
    const ex = findEx(name), d = defaultsFor(ex);
    const en = makeEntry(ex ? ex.n : name, d.sets, d.reps, d.rest);
    S.active.entries.push(en); persist("active"); render();
    setTimeout(() => document.querySelector(`[data-entry="${en.id}"]`)?.scrollIntoView({ block: "start", behavior: "smooth" }), 50);
  },
  async finish() {
    if (document.activeElement) document.activeElement.blur();
    const w = S.active;
    const open = w.entries.reduce((a, e) => a + e.sets.filter(s => !s.done).length, 0);
    if (!(await ask({ title: "Training beenden?", text: open ? `${open} nicht abgehakte Sätze werden nicht gespeichert.` : "Alle Sätze sind abgehakt. Stark!", ok: "Beenden & speichern" }))) return;
    const entries = w.entries.map(e => ({ ...e, sets: e.sets.filter(s => s.done) })).filter(e => e.sets.length || (e.note || "").trim());
    S.active = null; S.timer = null; persist("active");
    if (entries.some(e => e.sets.length)) {
      const rec = { id: w.id, planId: w.planId, planName: w.planName, start: w.start, end: Date.now(), entries };
      S.history.unshift(rec); persist("wo:" + rec.id);
      S.openHist = rec.id; S.view = "history";
    } else S.view = "home";
    render(); window.scrollTo(0, 0);
  },
  async discard() {
    if (!(await ask({ title: "Training verwerfen?", text: "Alle Einträge dieses Trainings gehen verloren.", ok: "Verwerfen", danger: true }))) return;
    S.active = null; S.timer = null; persist("active"); S.view = "home"; render();
  },
  "timer-add"(el) {
    if (!S.timer) return;
    S.timer.end += Number(el.dataset.d) * 1000; S.timer.total = Math.max(1000, S.timer.total + Number(el.dataset.d) * 1000);
    S.timer.rang = false; clearTimeout(overHide);
    if (S.timer.end <= Date.now()) S.timer = null;
    saveLocal(); tick();
  },
  async "set-goal"() {
    const v = await ask({ title: "Wochenziel", text: "Wie viele Trainings willst du pro Woche schaffen?", ok: "Speichern", input: "Aktuell " + (S.body.goal || 3) });
    const n = parseInt(v, 10);
    if (!v || isNaN(n) || n < 1 || n > 14) return;
    S.body.goal = n; persist("body"); render();
  },
  "weight-save"() {
    const inp = document.getElementById("wt-in"), v = num(inp.value), d = document.getElementById("wt-date").value;
    if (v == null || v < 20 || v > 400) { const f = document.getElementById("wt-field"); f.classList.add("err"); inp.focus(); setTimeout(() => f.classList.remove("err"), 1500); return; }
    const t = d ? new Date(d + "T12:00:00").getTime() : Date.now(), key = dayKey(t);
    const ex = S.body.weights.find(w => dayKey(w.t) === key);
    if (ex) ex.kg = v; else S.body.weights.push({ id: uid(), t, kg: v });
    S.body.weights.sort((a, b) => a.t - b.t);
    persist("body"); render();
  },
  async "weight-del"(el) {
    const w = S.body.weights.find(x => x.id === el.dataset.id); if (!w) return;
    if (!(await ask({ title: "Eintrag löschen?", text: `${kg(w.kg)} kg vom ${fmtDate(w.t)} wird entfernt.`, ok: "Löschen", danger: true }))) return;
    S.body.weights = S.body.weights.filter(x => x !== w); persist("body"); render();
  },
  wrange(el) { S.wRange = el.dataset.r; render(); },
  wall() { S.wAll = true; render(); },
  "hist-open"(el) { S.view = "history"; S.openHist = el.dataset.id; render(); setTimeout(() => document.getElementById("h-" + el.dataset.id)?.scrollIntoView({ block: "start" }), 30); },
  async "backup-export"() {
    const data = JSON.stringify({ app: "GymLog", version: 1, exported: Date.now(), plans: S.plans, history: S.history, body: S.body, active: S.active }, null, 1);
    const name = "GymLog-Sicherung-" + dayKey(Date.now()) + ".json";
    try {
      const file = new File([data], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  "timer-skip"() { S.timer = null; clearTimeout(overHide); saveLocal(); tick(); },
  hist(el) { S.openHist = S.openHist === el.dataset.id ? null : el.dataset.id; render(); },
  async "hist-del"(el) {
    if (!(await ask({ title: "Training löschen?", text: "Dieses Training wird endgültig aus dem Verlauf entfernt.", ok: "Löschen", danger: true }))) return;
    S.history = S.history.filter(w => w.id !== el.dataset.id); persist("wo:" + el.dataset.id); render();
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el);
});

document.addEventListener("change", async e => {
  if (e.target.id !== "backup-file" || !e.target.files[0]) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d || !Array.isArray(d.plans) || !Array.isArray(d.history)) throw new Error("format");
    if (!(await ask({ title: "Sicherung laden?", text: `${d.plans.length} Pläne, ${d.history.length} Trainings. Deine aktuellen Daten auf diesem iPhone werden ersetzt.`, ok: "Laden", danger: true }))) return;
    S.plans = d.plans; S.history = d.history; S.body = Object.assign({ weights: [], goal: 3 }, d.body || {}); S.active = d.active || null;
    saveLocal(); S.view = "home"; render();
  } catch (x) { await ask({ title: "Datei nicht lesbar", text: "Das ist keine GymLog-Sicherung. Wähl die .json-Datei, die du exportiert hast.", ok: "OK" }); }
  finally { e.target.value = ""; }
});
document.addEventListener("keydown", e => { if (e.target.id === "wt-in" && e.key === "Enter") A["weight-save"](); });
document.addEventListener("input", e => {
  const el = e.target, b = el.dataset.bind;
  if (!b) return;
  if (b === "plan-name") { editing().name = el.value; persist("plans"); }
  else if (b === "ex") {
    const ex = editing().exercises.find(x => x.id === el.dataset.ex); const f = el.dataset.f;
    if (f === "name") { ex.name = el.value; const pc = document.getElementById("pic-" + ex.id); if (pc) pc.innerHTML = picto(ex.name); }
    else { const n = parseInt(el.value, 10); if (!isNaN(n) && n > 0) ex[f] = Math.min(n, f === "rest" ? 900 : 99); }
    persist("plans");
  } else if (b === "set") {
    const s = S.active.entries[+el.dataset.e].sets[+el.dataset.s];
    if (el.dataset.f === "w") s.w = num(el.value); else { const n = parseInt(el.value, 10); s.r = isNaN(n) ? null : n; }
    persist("active");
  } else if (b === "note") {
    S.active.entries[+el.dataset.e].note = el.value; persist("active");
  }
});
// Gewicht beim Verlassen schön formatieren und das Feld markieren, wenn man reintippt
document.addEventListener("focusin", e => { if (e.target.matches(".set input")) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });
document.addEventListener("focusout", e => {
  const el = e.target;
  if (el.dataset.bind === "set" && el.dataset.f === "w") { const s = S.active?.entries[+el.dataset.e]?.sets[+el.dataset.s]; if (s) el.value = s.w == null ? "" : kg(s.w); }
  if (el.dataset.bind === "ex" && el.dataset.f !== "name") { const ex = editing()?.exercises.find(x => x.id === el.dataset.ex); if (ex) el.value = ex[el.dataset.f]; }
});

init();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
